name: content-functional-tests

services:
  runner:
    build:
      context: ..
      dockerfile: functional/Dockerfile
    env_file:
      - ./.env
    depends_on:
      api:
        condition: service_started
    restart: "no"

  api:
    build:
      context: ../../../content
    expose:
      - "8000"
    env_file:
      - ./.env
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.10.3
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  elasticsearch:
    build:
      context: ../../../../infrastructure/elasticsearch
    expose:
      - "9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  redis_data:
    name: content-functional-tests-redis-data

  elasticsearch_data:
    name: content-functional-tests-elasticsearch-data
