services:
  tests:
    build:
      context: ..
      dockerfile: functional/Dockerfile
    container_name: tests
    env_file:
      - ./.env
    depends_on:
      api:
        condition: service_started
  api:
    build:
      context: ../../src
      dockerfile: Dockerfile.local
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    restart: on-failure
    volumes:
      - ../../src:/src
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8.10.1
    container_name: redis
    ports:
      - "6379:6379"
    restart: on-failure
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  elasticsearch:
    build:
      context: ../../elasticsearch
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    restart: on-failure
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  redis_data:
  elasticsearch_data: