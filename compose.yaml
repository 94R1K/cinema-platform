name: cinema-platform

services:
  content:
    build:
      context: ./services/content
      target: production
    expose:
      - "8000"
    env_file:
      - ./services/content/.env
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin-panel:
    build:
      context: ./services/admin_panel
      target: production
    expose:
      - "8000"
    env_file:
      - ./services/admin_panel/.env
    volumes:
      - admin_static:/var/www/static
      - admin_media:/var/www/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  etl:
    build:
      context: ./services/etl
    env_file:
      - ./services/etl/.env
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.10.3
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    build:
      context: ./infrastructure/elasticsearch
    expose:
      - "9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:18.6-trixie
    expose:
      - "5432"
    entrypoint: ["/bin/bash", "/scripts/entrypoint.sh"]
    command: ["postgres"]
    env_file:
      - ./infrastructure/postgres/.env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/scripts:/scripts:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/postgres-provisioned && pg_isready -h 127.0.0.1 -p \"$${PGPORT:-5432}\" -U \"$${POSTGRES_USER:-postgres}\" -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.31.8-trixie
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/routes:/etc/nginx/routes:ro
      - admin_static:/var/www/static:ro
      - admin_media:/var/www/media:ro
    depends_on:
      - admin-panel
      - content
    restart: unless-stopped

volumes:
  redis_data:
  elasticsearch_data:
  postgres_data:
  admin_static:
  admin_media:
